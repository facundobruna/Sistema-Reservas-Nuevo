name: CI

# Cuándo corre el pipeline.
on:
  pull_request:
    branches: [main]   # el que hace el trabajo: verifica ANTES de que el código entre a main
  push:
    branches: [main]   # para que main tenga su propia corrida, que es la que lee el badge

# Una corrida por rama a la vez. Si empujo un commit nuevo mientras la corrida
# anterior de ese mismo Pull Request sigue trabajando, la vieja se cancela: su
# resultado ya no le sirve a nadie, porque verifica un código que quedó atrás.
# Ahorra minutos de runner y evita que el check quede reportando un estado viejo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Desde la separación back/front son TRES jobs y no dos: hay tres imágenes que
# construir. Corren en paralelo y no comparten nada — si se rompe una, quiero
# enterarme aunque las otras dos compilen bien.
jobs:
  # ---------------------------------------------------------------------------
  # El backend: etapa `runner` de backend/Dockerfile, la imagen de la API.
  # ---------------------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          # En un pull_request, github.ref_name vale "<numero>/merge" y no dice nada.
          # head_ref es el nombre real de la rama que se está verificando.
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        # El constructor de fábrica guarda las capas en el disco de la máquina, y
        # esa máquina se destruye al terminar. Éste sabe exportarlas al almacén de
        # GitHub. Sin este paso, el build falla al intentar exportar el cache.
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v7
        with:
          # El contexto es la carpeta del backend, no la raíz: el build no puede
          # ver el frontend. Es la misma separación, sostenida también acá.
          context: ./backend
          target: runner
          push: false                # sólo se verifica que construya; publicar es otra cosa
          tags: sistema-reservas-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ---------------------------------------------------------------------------
  # El frontend: etapa `runner` de frontend/Dockerfile.
  # ---------------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          push: false
          tags: sistema-reservas-frontend:ci
          # scope PROPIO: sin esto los jobs comparten estante de cache y se
          # pisan — el último en terminar borra el del otro.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # Las migraciones: etapa `migrator` de backend/Dockerfile.
  # ---------------------------------------------------------------------------
  build-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de migraciones
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: migrator
          push: false
          tags: sistema-reservas-migrate:ci
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
