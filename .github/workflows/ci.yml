name: CI

# Cuándo corre el pipeline.
on:
  pull_request:
    branches: [main]   # el que hace el trabajo: verifica ANTES de que el código entre a main
  push:
    branches: [main]   # para que main tenga su propia corrida, que es la que lee el badge

# Una corrida por rama a la vez. Si empujo un commit nuevo mientras la corrida
# anterior de ese mismo Pull Request sigue trabajando, la vieja se cancela: su
# resultado ya no le sirve a nadie, porque verifica un código que quedó atrás.
# Ahorra minutos de runner y evita que el check quede reportando un estado viejo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Desde la separación back/front son TRES jobs y no dos: hay tres imágenes que
# construir. Corren en paralelo y no comparten nada — si se rompe una, quiero
# enterarme aunque las otras dos compilen bien.
jobs:
  # ---------------------------------------------------------------------------
  # El backend: etapa `runner` de backend/Dockerfile (la imagen de la API) y,
  # además, su etapa `test` (tests unitarios + cobertura, TP5).
  # ---------------------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    # Permisos del GITHUB_TOKEN para ESTE job (y no para todo el workflow): leer el
    # código y escribir paquetes. Es lo que permite publicar en ghcr.io sin
    # guardar ninguna contraseña en el repo.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          # En un pull_request, github.ref_name vale "<numero>/merge" y no dice nada.
          # head_ref es el nombre real de la rama que se está verificando.
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        # El constructor de fábrica guarda las capas en el disco de la máquina, y
        # esa máquina se destruye al terminar. Éste sabe exportarlas al almacén de
        # GitHub. Sin este paso, el build falla al intentar exportar el cache.
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        # Solo en push (a main): en un pull_request no se publica nada, así que
        # ni siquiera se abre sesión. Este paso aparece "skipped" en la corrida
        # del PR: es la prueba de que el PR no tiene camino hacia el registry.
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Tests y cobertura (TP5) -------------------------------------------
      # La etapa `test` del Dockerfile corre vitest con cobertura. Se construye
      # como imagen (load: true la deja disponible para `docker run` en este
      # mismo runner) y se ejecuta aparte: si el umbral falla, la imagen igual
      # existe y el reporte igual se escribe.
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true                 # la deja en el Docker local del runner, para poder correrla
          push: false
          tags: sistema-reservas-backend-test:ci
          # Solo lee: reutiliza las capas del build anterior (misma `builder`)
          # y no exporta nada, para no pisar el cache del scope de arriba.
          cache-from: type=gha,scope=backend

      - name: Correr los tests y medir la cobertura (backend)
        # El código de salida de `docker run` es el de vitest: distinto de cero si
        # un test falla O si la cobertura queda bajo el umbral. Eso pone el job en
        # rojo, y por eso build-backend es un check requerido que puede fallar
        # por cobertura. El reporte se escribe en una carpeta montada para que
        # sobreviva al contenedor (COVERAGE_DIR, ver vitest.config.ts).
        run: |
          mkdir -p backend-coverage
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "$GITHUB_WORKSPACE/backend-coverage:/salida" \
            sistema-reservas-backend-test:ci

      - name: Mostrar la cobertura en el resumen de la corrida
        # `!cancelled()` y no el `success()` implícito: si el paso anterior falló
        # por el umbral, justo entonces queremos ver los números.
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs "Backend" backend-coverage/reporte/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el reporte de cobertura (backend)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend   # nombre propio: dos artefactos con el mismo nombre rompen la corrida
          path: backend-coverage/reporte
          if-no-files-found: error

      # --- Publicar (TP6) -----------------------------------------------------
      # ÚLTIMO paso del job, a propósito: si arriba falló el build o un test, el
      # job se corta ahí y esto nunca corre. Nada se publica sin haber pasado
      # por los tests en este mismo job. Y `push` solo vale true en un push a
      # main: en un PR el mismo paso construye, pero no publica.
      # El tag es el commit exacto: la imagen se puede rastrear hasta su código.
      # El nombre va en minúsculas escrito a mano: ghcr.io rechaza mayúsculas.
      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/facundobruna/sistema-reservas-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ---------------------------------------------------------------------------
  # El frontend: etapa `runner` de frontend/Dockerfile y su etapa `test`.
  # ---------------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    # Permisos del GITHUB_TOKEN para ESTE job (y no para todo el workflow): leer el
    # código y escribir paquetes. Es lo que permite publicar en ghcr.io sin
    # guardar ninguna contraseña en el repo.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Entrar al registry
        # Solo en push (a main): en un pull_request no se publica nada, así que
        # ni siquiera se abre sesión. Este paso aparece "skipped" en la corrida
        # del PR: es la prueba de que el PR no tiene camino hacia el registry.
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Tests y cobertura (TP5) -------------------------------------------
      # La etapa `test` del Dockerfile corre vitest con cobertura. Se construye
      # como imagen (load: true la deja disponible para `docker run` en este
      # mismo runner) y se ejecuta aparte: si el umbral falla, la imagen igual
      # existe y el reporte igual se escribe.
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true                 # la deja en el Docker local del runner, para poder correrla
          push: false
          tags: sistema-reservas-frontend-test:ci
          # Solo lee: reutiliza las capas del build anterior (misma `builder`)
          # y no exporta nada, para no pisar el cache del scope de arriba.
          cache-from: type=gha,scope=frontend

      - name: Correr los tests y medir la cobertura (frontend)
        # El código de salida de `docker run` es el de vitest: distinto de cero si
        # un test falla O si la cobertura queda bajo el umbral. Eso pone el job en
        # rojo, y por eso build-frontend es un check requerido que puede fallar
        # por cobertura. El reporte se escribe en una carpeta montada para que
        # sobreviva al contenedor (COVERAGE_DIR, ver vitest.config.ts).
        run: |
          mkdir -p frontend-coverage
          docker run --rm \
            -e COVERAGE_DIR=/salida/reporte \
            -v "$GITHUB_WORKSPACE/frontend-coverage:/salida" \
            sistema-reservas-frontend-test:ci

      - name: Mostrar la cobertura en el resumen de la corrida
        # `!cancelled()` y no el `success()` implícito: si el paso anterior falló
        # por el umbral, justo entonces queremos ver los números.
        if: ${{ !cancelled() }}
        run: node .github/scripts/coverage-summary.mjs "Frontend" frontend-coverage/reporte/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el reporte de cobertura (frontend)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend   # nombre propio: dos artefactos con el mismo nombre rompen la corrida
          path: frontend-coverage/reporte
          if-no-files-found: error

      # --- Publicar (TP6) -----------------------------------------------------
      # ÚLTIMO paso del job, a propósito: si arriba falló el build o un test, el
      # job se corta ahí y esto nunca corre. Nada se publica sin haber pasado
      # por los tests en este mismo job. Y `push` solo vale true en un push a
      # main: en un PR el mismo paso construye, pero no publica.
      # El tag es el commit exacto: la imagen se puede rastrear hasta su código.
      # El nombre va en minúsculas escrito a mano: ghcr.io rechaza mayúsculas.
      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/facundobruna/sistema-reservas-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # Las migraciones: etapa `migrator` de backend/Dockerfile.
  # ---------------------------------------------------------------------------
  build-migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de migraciones
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: migrator
          push: false
          tags: sistema-reservas-migrate:ci
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

  # ---------------------------------------------------------------------------
  # Deploy a QA (TP6). La promoción arranca donde termina la verificación.
  # ---------------------------------------------------------------------------
  deploy-qa:
    runs-on: ubuntu-latest
    # Sin los tres checks en verde no hay deploy. `needs` es la compuerta.
    needs: [build-backend, build-frontend, build-migrate]
    # Los PRs verifican; solo un push a main despliega. En un PR este job sale
    # salteado (y los de PROD, que dependen de éste, también).
    if: github.ref == 'refs/heads/main'
    # Conecta el job al environment `qa`: de ahí salen los secrets (los hooks de
    # Render de QA) y en ese environment queda el historial de despliegues.
    environment: qa
    steps:
      # El `&ref=` es lo importante. Un hook pelado despliega la PUNTA de la rama,
      # no el commit que este pipeline acaba de verificar: con dos merges seguidos,
      # la corrida del primero desplegaría el segundo, que todavía no pasó por
      # nada. Con `&ref=$GITHUB_SHA` Render despliega exactamente este commit.
      # Va con `&` y no con `?` porque la URL del hook ya trae un `?key=...`.
      - name: Disparar el deploy en Render (API y front) del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&ref=$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&ref=$GITHUB_SHA"

      # Smoke test: ¿QA contesta? Reintenta (30 veces, cada 20 s = hasta 10 min)
      # porque el free tier de Render duerme los servicios y el deploy reconstruye
      # desde el repo: despertar y arrancar tarda minutos. Un curl único daría
      # falsos rojos. Cada curl lleva --max-time: un servicio despertando acepta
      # la conexión y no contesta, y sin tope el job se colgaría.
      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://reserves-api-qa.onrender.com
          URL_FRONT: https://reservas-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            # 1) la API: /health toca la base (select 1), así que devuelve error si
            #    la connection string está rota; no basta con que el proceso viva.
            # 2) el front sirviendo su portada.
            # 3) el front llegando a la API a través de su proxy (variable de entorno).
            if curl -fsS --max-time 10 "$URL_API/api/v1/health" \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/v1/health" > /dev/null; then
              echo "QA responde (API + base + front + proxy)"; exit 0
            fi
            echo "intento $i/30: todavía no, espero 20 s"
            sleep 20
          done
          echo "QA no respondió a tiempo"; exit 1