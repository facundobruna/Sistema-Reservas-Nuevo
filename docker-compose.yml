services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-reservas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reservas}
      POSTGRES_DB: ${DB_NAME:-reservas}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reservas} -d ${DB_NAME:-reservas}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
